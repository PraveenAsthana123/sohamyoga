services:
  postgres:
    image: postgres:16-alpine
    container_name: passwordmanager-postgres
    environment:
      POSTGRES_DB: "${POSTGRES_DB:-passwordmanager}"
      POSTGRES_USER: "${POSTGRES_USER:-passwordmanager}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-change-me-before-production}"
    ports:
      - "${POSTGRES_PORT:-5439}:5432"
    volumes:
      - passwordmanager-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-passwordmanager} -d ${POSTGRES_DB:-passwordmanager}" ]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  passwordmanager-postgres-data:
