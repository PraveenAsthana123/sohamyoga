name: sohamyoga-activepieces

# Activepieces Community Edition — tenant workflow orchestration.
# The UI is intentionally loopback-only. Put it behind the portal/reverse proxy
# with HTTPS before enabling public webhooks.
services:
  activepieces-db:
    image: postgres:16-alpine
    container_name: sohamyoga-activepieces-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: activepieces
      POSTGRES_USER: activepieces
      POSTGRES_PASSWORD: ${ACTIVEPIECES_DB_PASSWORD:?set in .env}
    volumes:
      - activepieces-db-data:/var/lib/postgresql/data
    networks: [activepieces-internal]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U activepieces -d activepieces"]
      interval: 10s
      timeout: 5s
      retries: 10

  activepieces-redis:
    image: redis:7-alpine
    container_name: sohamyoga-activepieces-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${ACTIVEPIECES_REDIS_PASSWORD:?set in .env}"]
    environment:
      ACTIVEPIECES_REDIS_PASSWORD: ${ACTIVEPIECES_REDIS_PASSWORD:?set in .env}
    volumes:
      - activepieces-redis-data:/data
    networks: [activepieces-internal]
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a $$ACTIVEPIECES_REDIS_PASSWORD ping | grep PONG"]
      interval: 10s
      timeout: 5s
      retries: 10

  activepieces:
    image: activepieces/activepieces@sha256:65ea85f5e7ea236416b342eef0d2dbade8da51247aaea495d191eb027095805a
    container_name: sohamyoga-activepieces
    restart: unless-stopped
    depends_on:
      activepieces-db:
        condition: service_healthy
      activepieces-redis:
        condition: service_healthy
    ports:
      - "127.0.0.1:18181:80"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      AP_CONTAINER_TYPE: WORKER_AND_APP
      AP_ENVIRONMENT: prod
      AP_FRONTEND_URL: ${ACTIVEPIECES_URL:-http://127.0.0.1:18181}
      AP_ENCRYPTION_KEY: ${ACTIVEPIECES_ENCRYPTION_KEY:?set in .env}
      AP_JWT_SECRET: ${ACTIVEPIECES_JWT_SECRET:?set in .env}
      AP_POSTGRES_DATABASE: activepieces
      AP_POSTGRES_HOST: activepieces-db
      AP_POSTGRES_PORT: 5432
      AP_POSTGRES_USERNAME: activepieces
      AP_POSTGRES_PASSWORD: ${ACTIVEPIECES_DB_PASSWORD:?set in .env}
      AP_REDIS_HOST: activepieces-redis
      AP_REDIS_PORT: 6379
      AP_REDIS_PASSWORD: ${ACTIVEPIECES_REDIS_PASSWORD:?set in .env}
      AP_EXECUTION_MODE: SANDBOX_CODE_ONLY
      AP_TELEMETRY_ENABLED: "false"
      AP_FILE_STORAGE_LOCATION: DB
      AP_MAX_CONCURRENT_JOBS_PER_PROJECT: 5
      AP_FLOW_TIMEOUT_SECONDS: 600
      AP_TRIGGER_DEFAULT_POLL_INTERVAL: 5
    volumes:
      - activepieces-cache:/usr/src/app/cache
    networks:
      - activepieces-internal
      - sohamyoga-net
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:80/api/v1/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 60s

networks:
  activepieces-internal:
    internal: true
    ipam:
      config:
        - subnet: 10.230.91.0/24
  sohamyoga-net:
    external: true

volumes:
  activepieces-db-data:
  activepieces-redis-data:
  activepieces-cache:
