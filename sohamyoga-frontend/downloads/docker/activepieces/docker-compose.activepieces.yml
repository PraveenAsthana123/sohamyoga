version: '3.9'
# Activepieces — No-code workflow automation
# UI: http://localhost:8181
# Use for: booking → email → WhatsApp → CRM → Google Calendar → Stripe

services:
  activepieces-db:
    image: postgres:16-alpine
    container_name: sohamyoga-activepieces-db
    restart: unless-stopped
    environment:
      POSTGRES_DB:       activepieces
      POSTGRES_USER:     activepieces
      POSTGRES_PASSWORD: ${ACTIVEPIECES_DB_PASSWORD:-ap_secret}
    volumes:
      - activepieces-db-data:/var/lib/postgresql/data
    networks:
      - sohamyoga-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U activepieces"]
      interval: 10s
      timeout: 5s
      retries: 5

  activepieces-redis:
    image: redis:7-alpine
    container_name: sohamyoga-activepieces-redis
    restart: unless-stopped
    networks:
      - sohamyoga-net

  activepieces:
    image: activepieces/activepieces:latest
    container_name: sohamyoga-activepieces
    restart: unless-stopped
    depends_on:
      activepieces-db:
        condition: service_healthy
      activepieces-redis:
        condition: service_started
    ports:
      - "8181:80"
    environment:
      AP_ENGINE_EXECUTABLE_PATH:  dist/packages/engine/main.js
      AP_API_KEY:                  ${ACTIVEPIECES_API_KEY}
      AP_ENCRYPTION_KEY:           ${ACTIVEPIECES_ENCRYPTION_KEY}
      AP_JWT_SECRET:               ${ACTIVEPIECES_JWT_SECRET}
      AP_POSTGRES_DATABASE:        activepieces
      AP_POSTGRES_HOST:            activepieces-db
      AP_POSTGRES_PORT:            5432
      AP_POSTGRES_USERNAME:        activepieces
      AP_POSTGRES_PASSWORD:        ${ACTIVEPIECES_DB_PASSWORD:-ap_secret}
      AP_REDIS_URL:                redis://activepieces-redis:6379
      AP_FRONTEND_URL:             ${ACTIVEPIECES_URL:-http://localhost:8181}
      # Webhook URL exposed to external services
      AP_WEBHOOK_TIMEOUT_SECONDS:  30
    networks:
      - sohamyoga-net
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:80/api/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 5

networks:
  sohamyoga-net:
    external: true

volumes:
  activepieces-db-data:
