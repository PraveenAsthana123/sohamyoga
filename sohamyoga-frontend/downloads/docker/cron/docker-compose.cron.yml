version: '3.9'

# Autonomous Cron Runner — all jobs use local Ollama, zero cloud tokens at runtime.
# Start: docker compose -f downloads/docker/cron/docker-compose.cron.yml up -d

services:
  sohamyoga-cron:
    build:
      context: ../../../          # root of sohamyoga-frontend
      dockerfile: downloads/docker/cron/Dockerfile
    container_name: sohamyoga-cron
    restart: unless-stopped
    env_file: ../../../.env       # DATABASE_URL, OLLAMA_BASE_URL, NOVU_API_KEY, etc.
    extra_hosts:
      - "host.docker.internal:host-gateway"   # lets container reach host Ollama
    environment:
      - NODE_ENV=production
      - OLLAMA_BASE_URL=${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      - OLLAMA_MODEL_FAST=${OLLAMA_MODEL_FAST:-phi3:mini}
      - OLLAMA_MODEL_STRONG=${OLLAMA_MODEL_STRONG:-llama3.2:latest}
      - NOTIFICATION_BATCH_SIZE=50
    networks:
      - sohamyoga-net
    volumes:
      - cron-logs:/app/logs
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"
    labels:
      - "com.sohamyoga.service=cron"
      - "com.sohamyoga.ai=ollama-local"
      - "com.sohamyoga.cloud-tokens=zero"

networks:
  sohamyoga-net:
    external: true

volumes:
  cron-logs:
