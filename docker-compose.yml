services:
  postgres:
    image: postgres:16-alpine
    container_name: sohamyoga-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: "${POSTGRES_DB:-sohamyoga}"
      POSTGRES_USER: "${POSTGRES_USER:-sohamyoga}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-change-me-before-production}"
    ports:
      - "${POSTGRES_PORT:-5437}:5432"
    volumes:
      - sohamyoga-postgres-data:/var/lib/postgresql/data
      - ./sohamyoga-frontend/src/domain/core/db-foundation.sql:/docker-entrypoint-initdb.d/001-foundation.sql:ro
      - ./sohamyoga-frontend/src/domain/social/db-schema.sql:/docker-entrypoint-initdb.d/020-social.sql:ro
      - ./sohamyoga-frontend/src/domain/marketing/automation-schema.sql:/docker-entrypoint-initdb.d/030-marketing-automation.sql:ro
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-sohamyoga} -d ${POSTGRES_DB:-sohamyoga}" ]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - sohamyoga-network

  # ── .NET Backend ──────────────────────────────────────────────────────────
  backend:
    build:
      context: ./SohamYoga/SohamYoga.Web
      dockerfile: Dockerfile
    image: sohamyoga-backend:latest
    container_name: sohamyoga-backend
    restart: unless-stopped
    ports:
      - "5070:5070"
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__DefaultConnection: "Data Source=/app/data/sohamyoga.db"
      Cors__AllowedOrigins__0: "http://localhost:3010"
      Cors__AllowedOrigins__1: "${FRONTEND_URL:-http://localhost:3010}"
      Admin__Email: "${ADMIN_EMAIL:-admin@sohamyoga.ca}"
      Admin__Password: "${ADMIN_PASSWORD:-Admin@123456}"
      Smtp__Host: "${SMTP_HOST:-}"
      Smtp__Port: "${SMTP_PORT:-587}"
      Smtp__Username: "${SMTP_USERNAME:-}"
      Smtp__Password: "${SMTP_PASSWORD:-}"
      RateLimit__MaxRequests: "${RATE_LIMIT:-100}"
      RateLimit__WindowSeconds: "60"
    volumes:
      - sohamyoga-data:/app/data
      - sohamyoga-logs:/app/logs
    healthcheck:
      test: [ "CMD", "wget", "-qO-", "http://localhost:5070/api/health" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    networks:
      - sohamyoga-network

  # ── Next.js Frontend ──────────────────────────────────────────────────────
  frontend:
    build:
      context: ./sohamyoga-frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: "${NEXT_PUBLIC_API_URL:-http://localhost:5062}"
    image: sohamyoga-frontend:latest
    container_name: sohamyoga-frontend
    restart: unless-stopped
    ports:
      - "3110:3010"
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: "${NEXT_PUBLIC_API_URL:-http://backend:5070}"
      # Server-only override read at runtime by lib/server-api.ts.
      # NEXT_PUBLIC_* is inlined at build time and would bake in a host-only
      # URL the container cannot reach; INTERNAL_API_URL stays runtime-readable.
      INTERNAL_API_URL: "http://backend:5070"
      # Local AI: the /api/ai/* routes stream from the host's Ollama daemon.
      # host.docker.internal resolves to the host via the extra_hosts mapping.
      OLLAMA_URL: "${OLLAMA_URL:-http://host.docker.internal:11434}"
      OLLAMA_MODEL: "${OLLAMA_MODEL:-qwen2.5:latest}"
      OLLAMA_KEEP_ALIVE: "${OLLAMA_KEEP_ALIVE:-30m}"
      # Agentic gateway (FastAPI): POST a goal -> Ollama planner -> task queue.
      AGENT_API_URL: "${AGENT_API_URL:-http://host.docker.internal:8091}"
      DATABASE_URL: "postgresql://${POSTGRES_USER:-sohamyoga}:${POSTGRES_PASSWORD:-change-me-before-production}@postgres:5432/${POSTGRES_DB:-sohamyoga}"
    extra_hosts:
      # Lets the container reach services (Ollama) bound on the host.
      - "host.docker.internal:host-gateway"
    depends_on:
      backend:
        condition: service_healthy
      postgres:
        condition: service_healthy
    healthcheck:
      # Standalone server.js binds IPv4 0.0.0.0:3010 only — busybox wget
      # resolves "localhost" to IPv6 [::1] first and fails, so probe IPv4 directly.
      test: [ "CMD", "wget", "-qO-", "http://127.0.0.1:3010" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    networks:
      - sohamyoga-network

  cron:
    build:
      context: ./sohamyoga-frontend
      dockerfile: Dockerfile.cron
    image: sohamyoga-cron:latest
    container_name: sohamyoga-cron
    restart: unless-stopped
    network_mode: host
    environment:
      DATABASE_URL: "postgresql://${POSTGRES_USER:-sohamyoga}:${POSTGRES_PASSWORD:-change-me-before-production}@127.0.0.1:${POSTGRES_PORT:-5437}/${POSTGRES_DB:-sohamyoga}"
      OLLAMA_BASE_URL: "${OLLAMA_URL:-http://127.0.0.1:11434}"
      OLLAMA_MODEL_FAST: "${OLLAMA_MODEL_FAST:-phi4-mini:latest}"
      OLLAMA_MODEL_CODE: "${OLLAMA_MODEL_CODE:-qwen2.5-coder:latest}"
      OLLAMA_MODEL_STRONG: "${OLLAMA_MODEL_STRONG:-qwen2.5:latest}"
    depends_on:
      postgres:
        condition: service_healthy

  # ── Nginx Reverse Proxy ───────────────────────────────────────────────────
  nginx:
    image: nginx:1.25-alpine
    container_name: sohamyoga-nginx
    restart: unless-stopped
    ports:
      - "8085:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
      - sohamyoga-logs:/var/log/nginx
    depends_on:
      - frontend
      - backend
    networks:
      - sohamyoga-network

volumes:
  sohamyoga-postgres-data:
    driver: local
  sohamyoga-data:
    driver: local
  sohamyoga-logs:
    driver: local

networks:
  sohamyoga-network:
    driver: bridge
