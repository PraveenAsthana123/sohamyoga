[global]
type=global
user_agent=SohamYoga-Voice-Control-Plane

[transport-udp]
type=transport
protocol=udp
bind=0.0.0.0:5060

[transport-tcp]
type=transport
protocol=tcp
bind=0.0.0.0:5060

[local-1001-auth]
type=auth
auth_type=userpass
username=1001
password=${ASTERISK_SIP_SECRET}

[local-1001-aor]
type=aor
max_contacts=1
remove_existing=yes

[local-1001]
type=endpoint
transport=transport-udp
context=from-local
disallow=all
allow=ulaw,alaw
auth=local-1001-auth
aors=local-1001-aor
direct_media=no

