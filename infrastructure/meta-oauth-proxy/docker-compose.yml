services:
  meta-oauth-proxy:
    image: nginx:1.27-alpine
    container_name: sohamyoga-meta-oauth-proxy
    restart: unless-stopped
    network_mode: host
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./proxy_params:/etc/nginx/proxy_params:ro
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:18443/proxy-health"]
      interval: 10s
      timeout: 3s
      retries: 5
