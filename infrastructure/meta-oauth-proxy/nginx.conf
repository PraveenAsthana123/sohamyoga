events { worker_connections 256; }
http {
  server {
    listen 127.0.0.1:18443;
    server_name _;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;

    location = /proxy-health { access_log off; return 200 'ok'; add_header Content-Type text/plain; }
    location = /api/socials/facebook/callback { proxy_pass http://127.0.0.1:8085; include /etc/nginx/proxy_params; }
    location = /privacy { proxy_pass http://127.0.0.1:8085; include /etc/nginx/proxy_params; }
    location = /terms { proxy_pass http://127.0.0.1:8085; include /etc/nginx/proxy_params; }
    location = /data-deletion { proxy_pass http://127.0.0.1:8085; include /etc/nginx/proxy_params; }
    location = /admin/social/meta-setup { proxy_pass http://127.0.0.1:8085; include /etc/nginx/proxy_params; }
    location / { return 404; }
  }
}
