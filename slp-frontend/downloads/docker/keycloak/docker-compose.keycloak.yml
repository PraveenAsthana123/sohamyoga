version: '3.9'
# Keycloak — Identity Provider, OAuth Server, SSO, MFA, RBAC
# UI: http://localhost:8080
# Admin console: http://localhost:8080/admin  (admin / set in KEYCLOAK_ADMIN_PASSWORD)
#
# Realms pre-configured:
#   slp      — main portal (students, staff, admin)
#   slp-dev  — development/testing
#
# Social login configured after first start via Admin Console:
#   Identity Providers: Google, Facebook, Apple, Microsoft

services:
  keycloak-db:
    image: postgres:16-alpine
    container_name: slp-keycloak-db
    restart: unless-stopped
    environment:
      POSTGRES_DB:       keycloak
      POSTGRES_USER:     keycloak
      POSTGRES_PASSWORD: ${KEYCLOAK_DB_PASSWORD:-keycloak_secret}
    volumes:
      - keycloak-db-data:/var/lib/postgresql/data
    networks:
      - slp-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U keycloak"]
      interval: 10s
      timeout: 5s
      retries: 5

  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    container_name: slp-keycloak
    restart: unless-stopped
    depends_on:
      keycloak-db:
        condition: service_healthy
    command: start-dev    # use 'start' (not start-dev) in production
    environment:
      KC_DB:                   postgres
      KC_DB_URL:               jdbc:postgresql://keycloak-db:5432/keycloak
      KC_DB_USERNAME:          keycloak
      KC_DB_PASSWORD:          ${KEYCLOAK_DB_PASSWORD:-keycloak_secret}
      KEYCLOAK_ADMIN:          admin
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin_change_me}
      KC_HOSTNAME:             ${KEYCLOAK_HOSTNAME:-localhost}
      KC_HTTP_PORT:            8080
      KC_FEATURES:             token-exchange,admin-fine-grained-authz,persistent-user-sessions
      # SMTP for email verification and password reset
      KC_SMTP_HOST:            ${SMTP_HOST:-localhost}
      KC_SMTP_PORT:            ${SMTP_PORT:-587}
      KC_SMTP_FROM:            ${SMTP_FROM:-noreply@sohamyoga.ca}
      KC_SMTP_USER:            ${SMTP_USER}
      KC_SMTP_PASSWORD:        ${SMTP_PASSWORD}
    ports:
      - "8080:8080"
    volumes:
      - ./realm-export:/opt/keycloak/data/import:ro
      - keycloak-data:/opt/keycloak/data
    networks:
      - slp-net
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/localhost/8080; echo -e 'GET /health/ready HTTP/1.0\r\n\r\n' >&3; timeout 2 cat <&3 | grep -q 'UP'"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 60s

networks:
  slp-net:
    external: true

volumes:
  keycloak-db-data:
  keycloak-data:
