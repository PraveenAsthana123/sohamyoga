version: '3.9'
# OpenBao — Vault-compatible secrets management
# Replaces plain .env for all API keys, OAuth tokens, DB passwords
# UI: http://localhost:8200
# NEVER commit the root token or unseal keys

services:
  openbao:
    image: openbao/openbao:latest
    container_name: slp-openbao
    restart: unless-stopped
    ports:
      - "127.0.0.1:${SOHAM_OPENBAO_PORT:-18200}:8200"
    cap_add:
      - IPC_LOCK       # required for memory locking
    environment:
      BAO_DEV_ROOT_TOKEN_ID: ${OPENBAO_ROOT_TOKEN:-changeme-in-production}
      BAO_DEV_LISTEN_ADDRESS: "0.0.0.0:8200"
    volumes:
      - openbao-data:/openbao/data
      - ./config:/openbao/config
    command: server -dev    # use 'server' (not -dev) in production
    networks:
      - slp-net
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8200/v1/sys/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # One-time secret seeder — runs and exits
  openbao-init:
    image: openbao/openbao:latest
    container_name: slp-openbao-init
    restart: "no"
    depends_on:
      openbao:
        condition: service_healthy
    environment:
      BAO_ADDR: http://openbao:8200
      BAO_TOKEN: ${OPENBAO_ROOT_TOKEN:-changeme-in-production}
    volumes:
      - ./seed-secrets.sh:/seed-secrets.sh:ro
    entrypoint: ["/bin/sh", "/seed-secrets.sh"]
    networks:
      - slp-net

networks:
  slp-net:
    external: true

volumes:
  openbao-data:
