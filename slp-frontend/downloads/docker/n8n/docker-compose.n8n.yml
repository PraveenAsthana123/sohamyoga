version: '3.9'
# n8n — Advanced workflow automation with code steps
# UI: http://localhost:5678
# Use for: AI pipelines — Claude → Generate Banner → Approval → Postiz → Facebook → Slack → CRM

services:
  n8n-db:
    image: postgres:16-alpine
    container_name: slp-n8n-db
    restart: unless-stopped
    environment:
      POSTGRES_DB:       n8n
      POSTGRES_USER:     n8n
      POSTGRES_PASSWORD: ${N8N_DB_PASSWORD:-n8n_secret}
    volumes:
      - n8n-db-data:/var/lib/postgresql/data
    networks:
      - slp-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U n8n"]
      interval: 10s
      timeout: 5s
      retries: 5

  n8n:
    image: n8nio/n8n:latest
    container_name: slp-n8n
    restart: unless-stopped
    depends_on:
      n8n-db:
        condition: service_healthy
    ports:
      - "5678:5678"
    extra_hosts:
      - "host.docker.internal:host-gateway"   # reach host Ollama
    environment:
      DB_TYPE:               postgresdb
      DB_POSTGRESDB_HOST:    n8n-db
      DB_POSTGRESDB_PORT:    5432
      DB_POSTGRESDB_DATABASE: n8n
      DB_POSTGRESDB_USER:    n8n
      DB_POSTGRESDB_PASSWORD: ${N8N_DB_PASSWORD:-n8n_secret}
      N8N_BASIC_AUTH_ACTIVE: "true"
      N8N_BASIC_AUTH_USER:   ${N8N_USER:-admin}
      N8N_BASIC_AUTH_PASSWORD: ${N8N_PASSWORD}
      N8N_HOST:              ${N8N_HOST:-localhost}
      N8N_PORT:              5678
      N8N_PROTOCOL:          http
      WEBHOOK_URL:           ${N8N_WEBHOOK_URL:-http://localhost:5678}
      EXECUTIONS_PROCESS:    main
      N8N_LOG_LEVEL:         info
      # Allow Ollama HTTP calls
      N8N_NODES_EXCLUDE:     ""
      OLLAMA_URL:            ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
    volumes:
      - n8n-data:/home/node/.n8n
      - ./workflows:/home/node/.n8n/workflows:ro
    networks:
      - slp-net
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:5678/healthz"]
      interval: 30s
      timeout: 10s
      retries: 5

networks:
  slp-net:
    external: true

volumes:
  n8n-db-data:
  n8n-data:
