version: "3.9"
# Rocket.Chat — internal staff communication
# Port 3200 (Rocket.Chat web)

services:
  rocketchat:
    image: rocketchat/rocket.chat:6.5
    container_name: sohamyoga_rocketchat
    restart: unless-stopped
    environment:
      MONGO_URL: "mongodb://rocketchat_mongo:27017/rocketchat"
      MONGO_OPLOG_URL: "mongodb://rocketchat_mongo:27017/local"
      ROOT_URL: "${ROCKETCHAT_URL:-http://localhost:3200}"
      PORT: "3000"
      ADMIN_USERNAME: "${ROCKETCHAT_ADMIN_USER:-admin}"
      ADMIN_PASS: "${ROCKETCHAT_ADMIN_PASSWORD:-CHANGE_ME}"
      ADMIN_EMAIL: "${ROCKETCHAT_ADMIN_EMAIL:-admin@sohamyoga.com}"
    ports:
      - "3200:3000"
    depends_on:
      - rocketchat_mongo

  rocketchat_mongo:
    image: mongo:6.0
    container_name: sohamyoga_rocketchat_mongo
    restart: unless-stopped
    command: mongod --oplogSize 128 --replSet rs0
    volumes:
      - rocketchat_mongo_data:/data/db

  rocketchat_mongo_init:
    image: mongo:6.0
    command: >
      bash -c "sleep 10 && mongosh rocketchat_mongo/rocketchat --eval \"rs.initiate({_id: 'rs0', members: [{_id: 0, host: 'rocketchat_mongo:27017'}]})\""
    depends_on:
      - rocketchat_mongo

volumes:
  rocketchat_mongo_data:

# ── Yoga-specific Rocket.Chat channels ─────────────────────────────
# #general         — all staff
# #teachers        — teacher-only discussions
# #class-schedule  — schedule changes and substitutes
# #student-support — escalations from Chatwoot
# #hr-announcements— Frappe HR payroll/leave notices
# #tech-alerts     — portal monitoring and downtime alerts
# SSO via Authentik OIDC
# ────────────────────────────────────────────────────────────────────
