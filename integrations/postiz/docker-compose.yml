version: "3.9"

# Postiz — self-hosted social media management
# Docs: https://docs.postiz.com
# Runs: Postiz app + PostgreSQL + Redis
# Port: 5000 (Postiz UI), 3000 (Postiz API)

services:
  postiz:
    image: ghcr.io/gitroomhq/postiz-app:latest
    container_name: sohamyoga_postiz
    restart: unless-stopped
    environment:
      # --- Required ---
      MAIN_URL: "${POSTIZ_URL:-http://localhost:15080}"
      BACKEND_INTERNAL_URL: "http://localhost:3000"
      FRONTEND_URL: "${POSTIZ_FRONTEND_URL:-http://localhost:15080}"
      IS_GENERAL: "true"

      # --- Database ---
      DATABASE_URL: "postgresql://postiz:${POSTGRES_PASSWORD:-postizpass}@postiz_db:5432/postiz"
      REDIS_URL: "redis://postiz_redis:6379"

      # --- Auth ---
      JWT_SECRET: "${POSTIZ_JWT_SECRET:-CHANGE_ME_postiz_jwt_secret_32chars}"
      BACKEND_SECRET: "${POSTIZ_SECRET:-CHANGE_ME_backend_secret}"

      # --- Storage (local) ---
      UPLOAD_DIRECTORY: "/uploads"
      NEXT_PUBLIC_UPLOAD_DIRECTORY: "/uploads"
      STORAGE_PROVIDER: "local"

      # --- Social OAuth (add keys after creating apps) ---
      FACEBOOK_APP_ID: "${FACEBOOK_APP_ID:-}"
      FACEBOOK_APP_SECRET: "${FACEBOOK_APP_SECRET:-}"
      INSTAGRAM_APP_ID: "${FACEBOOK_APP_ID:-}"
      INSTAGRAM_APP_SECRET: "${FACEBOOK_APP_SECRET:-}"
      THREADS_APP_ID: "${THREADS_APP_ID:-${FACEBOOK_APP_ID:-}}"
      THREADS_APP_SECRET: "${THREADS_APP_SECRET:-${FACEBOOK_APP_SECRET:-}}"
      # LINKEDIN_CLIENT_ID: "${LINKEDIN_CLIENT_ID}"
      # LINKEDIN_CLIENT_SECRET: "${LINKEDIN_CLIENT_SECRET}"
      # X_CLIENT_ID: "${X_CLIENT_ID}"
      # X_CLIENT_SECRET: "${X_CLIENT_SECRET}"
      # YOUTUBE_CLIENT_ID: "${YOUTUBE_CLIENT_ID}"
      # YOUTUBE_CLIENT_SECRET: "${YOUTUBE_CLIENT_SECRET}"
      # REDDIT_CLIENT_ID: "${REDDIT_CLIENT_ID}"
      # REDDIT_CLIENT_SECRET: "${REDDIT_CLIENT_SECRET}"
      # TIKTOK_CLIENT_ID: "${TIKTOK_CLIENT_ID}"
      # TIKTOK_CLIENT_SECRET: "${TIKTOK_CLIENT_SECRET}"
      # PINTEREST_CLIENT_ID: "${PINTEREST_CLIENT_ID}"
      # PINTEREST_CLIENT_SECRET: "${PINTEREST_CLIENT_SECRET}"
      # DISCORD_BOT_TOKEN: "${DISCORD_BOT_TOKEN}"

    ports:
      - "127.0.0.1:${SOHAM_POSTIZ_PORT:-15080}:5000"
      - "127.0.0.1:${SOHAM_POSTIZ_API_PORT:-15081}:3000"
    volumes:
      - postiz_uploads:/uploads
    depends_on:
      postiz_db:
        condition: service_healthy
      postiz_redis:
        condition: service_started

  postiz_db:
    image: postgres:16-alpine
    container_name: sohamyoga_postiz_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postiz
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-postizpass}"
      POSTGRES_DB: postiz
    volumes:
      - postiz_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postiz"]
      interval: 10s
      timeout: 5s
      retries: 5

  postiz_redis:
    image: redis:7-alpine
    container_name: sohamyoga_postiz_redis
    restart: unless-stopped
    volumes:
      - postiz_redis_data:/data

volumes:
  postiz_uploads:
  postiz_pg_data:
  postiz_redis_data:

# ── How to start ──────────────────────────────────────────────
# 1. Copy .env.example → .env and fill in secrets + OAuth keys
# 2. docker compose up -d
# 3. Open http://localhost:5000 → create admin account
# 4. Connect social accounts via OAuth in Postiz UI
# 5. Set POSTIZ_URL and POSTIZ_SECRET in sohamyoga-frontend/.env.local
# ──────────────────────────────────────────────────────────────
