version: "3.9"

# Postiz — self-hosted social media management
# Docs: https://docs.postiz.com
# Runs: Postiz app + PostgreSQL + Redis
# Port: 5000 (Postiz UI), 3000 (Postiz API)

services:
  postiz:
    image: ghcr.io/gitroomhq/postiz-app:latest
    container_name: sohamyoga_postiz
    restart: unless-stopped
    environment:
      # --- Required ---
      MAIN_URL: "${POSTIZ_URL:-http://localhost:15080}"
      BACKEND_INTERNAL_URL: "http://localhost:3000"
      # Read server-side by the backend process itself (apps/backend/dist/.../
      # start.mcp.js: `new URL('/mcp-oauth', process.env.NEXT_PUBLIC_BACKEND_URL)`)
      # despite the NEXT_PUBLIC_ naming — left unset, the backend crash-loops on
      # every boot with "TypeError: Invalid URL". Same value as BACKEND_INTERNAL_URL
      # since both are resolved from inside this same container.
      NEXT_PUBLIC_BACKEND_URL: "http://localhost:3000"
      FRONTEND_URL: "${POSTIZ_FRONTEND_URL:-http://localhost:15080}"
      IS_GENERAL: "true"

      # A real Temporal server (postiz_temporal, below) is now deployed —
      # Temporal's own official `server start-dev` mode, embedded SQLite,
      # zero external Postgres/Elasticsearch dependency. This unblocks
      # account registration for real (POST /auth/register signals a
      # Temporal workflow; it previously failed outright with "Failed to
      # signalWithStart Workflow" because nothing was listening on
      # TEMPORAL_ADDRESS at all). TEMPORAL_TLS must NOT be "true" now: that
      # flag makes TemporalRegister.onModuleInit skip registering the
      # organizationId/postId custom search attributes the app needs — it
      # was only ever a workaround for the "no server exists" case, which
      # no longer applies.
      TEMPORAL_ADDRESS: "postiz_temporal:7233"
      TEMPORAL_TLS: "false"

      # --- Database ---
      DATABASE_URL: "postgresql://postiz:${POSTGRES_PASSWORD:-postizpass}@postiz_db:5432/postiz"
      REDIS_URL: "redis://postiz_redis:6379"

      # --- Auth ---
      JWT_SECRET: "${POSTIZ_JWT_SECRET:-CHANGE_ME_postiz_jwt_secret_32chars}"
      BACKEND_SECRET: "${POSTIZ_SECRET:-CHANGE_ME_backend_secret}"

      # --- Storage (local) ---
      UPLOAD_DIRECTORY: "/uploads"
      NEXT_PUBLIC_UPLOAD_DIRECTORY: "/uploads"
      STORAGE_PROVIDER: "local"

      # --- Social OAuth (add keys after creating apps) ---
      FACEBOOK_APP_ID: "${FACEBOOK_APP_ID:-}"
      FACEBOOK_APP_SECRET: "${FACEBOOK_APP_SECRET:-}"
      INSTAGRAM_APP_ID: "${FACEBOOK_APP_ID:-}"
      INSTAGRAM_APP_SECRET: "${FACEBOOK_APP_SECRET:-}"
      THREADS_APP_ID: "${THREADS_APP_ID:-${FACEBOOK_APP_ID:-}}"
      THREADS_APP_SECRET: "${THREADS_APP_SECRET:-${FACEBOOK_APP_SECRET:-}}"
      # LINKEDIN_CLIENT_ID: "${LINKEDIN_CLIENT_ID}"
      # LINKEDIN_CLIENT_SECRET: "${LINKEDIN_CLIENT_SECRET}"
      # X_CLIENT_ID: "${X_CLIENT_ID}"
      # X_CLIENT_SECRET: "${X_CLIENT_SECRET}"
      # YOUTUBE_CLIENT_ID: "${YOUTUBE_CLIENT_ID}"
      # YOUTUBE_CLIENT_SECRET: "${YOUTUBE_CLIENT_SECRET}"
      # REDDIT_CLIENT_ID: "${REDDIT_CLIENT_ID}"
      # REDDIT_CLIENT_SECRET: "${REDDIT_CLIENT_SECRET}"
      # TIKTOK_CLIENT_ID: "${TIKTOK_CLIENT_ID}"
      # TIKTOK_CLIENT_SECRET: "${TIKTOK_CLIENT_SECRET}"
      # PINTEREST_CLIENT_ID: "${PINTEREST_CLIENT_ID}"
      # PINTEREST_CLIENT_SECRET: "${PINTEREST_CLIENT_SECRET}"
      # DISCORD_BOT_TOKEN: "${DISCORD_BOT_TOKEN}"

    ports:
      - "127.0.0.1:${SOHAM_POSTIZ_PORT:-15080}:5000"
      - "127.0.0.1:${SOHAM_POSTIZ_API_PORT:-15081}:3000"
    volumes:
      - postiz_uploads:/uploads
    depends_on:
      postiz_db:
        condition: service_healthy
      postiz_redis:
        condition: service_started
      postiz_temporal:
        condition: service_healthy

  postiz_temporal:
    image: temporalio/temporal:latest
    container_name: sohamyoga_postiz_temporal
    restart: unless-stopped
    # Temporal's own officially-supported single-process dev mode — embedded
    # SQLite persistence, no separate Postgres/Elasticsearch cluster needed.
    # Real Temporal server software, just configured for local/dev use
    # instead of a production multi-node deployment.
    command: server start-dev --ip 0.0.0.0 --port 7233 --http-port 7243 --ui-port 8233 --db-filename /data/temporal.db
    ports:
      - "127.0.0.1:${SOHAM_TEMPORAL_UI_PORT:-18233}:8233"
    volumes:
      - postiz_temporal_data:/data
    healthcheck:
      test: ["CMD", "temporal", "operator", "cluster", "health", "--address", "127.0.0.1:7233"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  postiz_db:
    image: postgres:16-alpine
    container_name: sohamyoga_postiz_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postiz
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-postizpass}"
      POSTGRES_DB: postiz
    volumes:
      - postiz_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postiz"]
      interval: 10s
      timeout: 5s
      retries: 5

  postiz_redis:
    image: redis:7-alpine
    container_name: sohamyoga_postiz_redis
    restart: unless-stopped
    volumes:
      - postiz_redis_data:/data

volumes:
  postiz_uploads:
  postiz_pg_data:
  postiz_redis_data:
  postiz_temporal_data:

# ── How to start ──────────────────────────────────────────────
# 1. Copy .env.example → .env and fill in secrets + OAuth keys
# 2. On a BRAND NEW volume only: the temporalio/temporal image runs as
#    uid 1000, but a freshly-created named Docker volume is root-owned,
#    which makes the embedded SQLite open fail ("out of memory (14)" —
#    actually a permissions error, not memory). One-time fix:
#      docker run --rm -v postiz_postiz_temporal_data:/data alpine \
#        chown -R 1000:1000 /data
#    Not needed on a volume that already has data (this repo's dev volume
#    has already been fixed once).
# 3. docker compose up -d
# 4. Register a real account: POST /auth/register to the API port (15081
#    by default) — or via the UI at http://localhost:15080. Log in, then
#    GET /user/self returns your real "publicApi" key.
# 5. Set POSTIZ_PUBLIC_API_URL (http://<host>:<api-port>/public/v1) and
#    POSTIZ_PUBLIC_API_KEY (that publicApi value) wherever
#    sohamyoga-frontend reads its runtime env from.
# 6. Connect social accounts via OAuth in the Postiz UI — this is the one
#    step that genuinely can't be automated (needs real platform app
#    credentials + a human completing the OAuth consent screen).
# ──────────────────────────────────────────────────────────────
